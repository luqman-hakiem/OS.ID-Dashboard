name: Build WebView APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 34
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          export PATH="$(dirname "$SDKMANAGER"):$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan signing key
        env:
          OSID_KEYSTORE_B64: ${{ secrets.OSID_KEYSTORE_B64 }}
          OSID_KEYSTORE_PASSWORD: ${{ secrets.OSID_KEYSTORE_PASSWORD }}
          OSID_KEYSTORE_KEY_PASSWORD: ${{ secrets.OSID_KEYSTORE_KEY_PASSWORD }}
          OSID_KEYSTORE_ALIAS: ${{ secrets.OSID_KEYSTORE_ALIAS }}
        run: |
          printf '%s' "$OSID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/osid-release.keystore"
          echo "OSID_KEYSTORE_PATH=$RUNNER_TEMP/osid-release.keystore" >> "$GITHUB_ENV"
          echo "OSID_KEYSTORE_PASSWORD=$OSID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OSID_KEYSTORE_KEY_PASSWORD=$OSID_KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "OSID_KEYSTORE_ALIAS=$OSID_KEYSTORE_ALIAS" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Siapkan artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OS.ID-Dashboard-1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OS.ID-Dashboard-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
