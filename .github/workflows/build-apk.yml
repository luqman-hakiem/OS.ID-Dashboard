name: Build WebView APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Siapkan artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OrangeSkyAdmin-1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/OrangeSkyAdmin-1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangesky-admin-webview-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
